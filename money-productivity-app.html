<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お金の生産性を振り返るアプリ</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
      background: #f9f7f4;
      padding: 2rem 1rem;
      color: #2c2c2c;
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .header {
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #e8e6e1;
      padding-bottom: 1rem;
    }

    .title {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .subtitle {
      font-size: 13px;
      color: #999;
      line-height: 1.6;
    }

    .month-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
      padding: 12px 14px;
      background: #f9f7f4;
      border-radius: 8px;
    }

    .month-label {
      font-size: 13px;
      color: #999;
      white-space: nowrap;
    }

    .month-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14px;
      color: #2c2c2c;
      outline: none;
      font-family: inherit;
    }

    .month-input::placeholder {
      color: #ccc;
    }

    .card {
      background: #fefdfb;
      border: 1px solid #e8e6e1;
      border-radius: 10px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .card-title {
      font-size: 13px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.75rem;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e8e6e1;
      border-radius: 6px;
      font-size: 14px;
      color: #2c2c2c;
      font-family: inherit;
      background: white;
      transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #d4a574;
      background: #fffbf7;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
      line-height: 1.5;
    }

    .button-group {
      display: flex;
      gap: 10px;
      margin-top: 1.5rem;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-copy {
      background: #d4a574;
      color: white;
    }

    .btn-copy:hover {
      background: #c49561;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(212, 165, 116, 0.3);
    }

    .btn-copy:active {
      transform: translateY(0);
    }

    .btn-reset {
      background: #f0ebe5;
      color: #666;
    }

    .btn-reset:hover {
      background: #e8e1d8;
    }

    .feedback {
      margin-top: 1rem;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      text-align: center;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.success {
      background: #e1f5ee;
      color: #0f6e56;
    }

    .feedback.error {
      background: #ffebee;
      color: #c62828;
    }

    .preview {
      background: #f9f7f4;
      border-radius: 6px;
      padding: 1rem;
      font-size: 12px;
      color: #666;
      margin-top: 1rem;
      line-height: 1.8;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'Courier New', monospace;
      display: none;
    }

    .preview.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">💰 お金の生産性を振り返る</h1>
      <p class="subtitle">今月の支出の中で、生産性が高かった買い物を3つ記録します。</p>
    </div>

    <div class="month-row">
      <label class="month-label">対象月</label>
      <input type="text" id="month" class="month-input" placeholder="2026年6月" />
    </div>

    <form id="appForm">
      <!-- Item 1 -->
      <div class="card">
        <div class="card-title">買い物 1</div>
        <div class="form-group">
          <label for="item1">品目</label>
          <input type="text" id="item1" placeholder="例：エアコン" />
        </div>
        <div class="form-group">
          <label for="price1">金額（円）</label>
          <input type="number" id="price1" placeholder="例：50000" />
        </div>
        <div class="form-group">
          <label for="reason1">生産性が高いと感じた理由</label>
          <textarea id="reason1" placeholder="例：猛暑対策で、仕事の集中力が上がった"></textarea>
        </div>
      </div>

      <!-- Item 2 -->
      <div class="card">
        <div class="card-title">買い物 2</div>
        <div class="form-group">
          <label for="item2">品目</label>
          <input type="text" id="item2" placeholder="例：スタンディングデスク" />
        </div>
        <div class="form-group">
          <label for="price2">金額（円）</label>
          <input type="number" id="price2" placeholder="例：25000" />
        </div>
        <div class="form-group">
          <label for="reason2">生産性が高いと感じた理由</label>
          <textarea id="reason2" placeholder="例：腰痛が減り、作業効率が30%向上した"></textarea>
        </div>
      </div>

      <!-- Item 3 -->
      <div class="card">
        <div class="card-title">買い物 3</div>
        <div class="form-group">
          <label for="item3">品目</label>
          <input type="text" id="item3" placeholder="例：ノイズキャンセリングイヤホン" />
        </div>
        <div class="form-group">
          <label for="price3">金額（円）</label>
          <input type="number" id="price3" placeholder="例：15000" />
        </div>
        <div class="form-group">
          <label for="reason3">生産性が高いと感じた理由</label>
          <textarea id="reason3" placeholder="例：集中力が上がり、リモート会議の音声がクリア"></textarea>
        </div>
      </div>

      <div class="button-group">
        <button type="button" class="btn-copy" id="copyBtn">クリップボードにコピー</button>
        <button type="reset" class="btn-reset">リセット</button>
      </div>

      <div class="feedback" id="feedback"></div>
      <div class="preview" id="preview"></div>
    </form>
  </div>

  <script>
    const copyBtn = document.getElementById('copyBtn');
    const form = document.getElementById('appForm');
    const feedback = document.getElementById('feedback');
    const preview = document.getElementById('preview');

    copyBtn.addEventListener('click', () => {
      const month = document.getElementById('month').value || '対象月未記入';
      
      const items = [];
      for (let i = 1; i <= 3; i++) {
        const item = document.getElementById(`item${i}`).value || `買い物${i}`;
        const price = document.getElementById(`price${i}`).value || '金額未記入';
        const reason = document.getElementById(`reason${i}`).value || '理由未記入';
        
        items.push({
          item,
          price,
          reason
        });
      }

      // Format text for clipboard
      const text = `📊 お金の生産性を振り返る

対象月：${month}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

【買い物 1】
品目：${items[0].item}
金額：¥${items[0].price}
理由：${items[0].reason}

【買い物 2】
品目：${items[1].item}
金額：¥${items[1].price}
理由：${items[1].reason}

【買い物 3】
品目：${items[2].item}
金額：¥${items[2].price}
理由：${items[2].reason}

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

合計：¥${parseInt(items[0].price || 0) + parseInt(items[1].price || 0) + parseInt(items[2].price || 0)}`;

      // Copy to clipboard
      navigator.clipboard.writeText(text).then(() => {
        feedback.textContent = '✓ クリップボードにコピーしました！Google Keep に貼り付けてください。';
        feedback.className = 'feedback show success';
        preview.textContent = text;
        preview.classList.add('show');
        setTimeout(() => {
          feedback.classList.remove('show');
        }, 3000);
      }).catch(() => {
        feedback.textContent = '✗ コピーに失敗しました。お手数ですが手動でコピーしてください。';
        feedback.className = 'feedback show error';
      });
    });
  </script>
</body>
</html>
